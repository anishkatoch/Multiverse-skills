<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nimbus - AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script>
  // Applied before paint so there's no flash of the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem("nimbus-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
</head>
<body>
  <div class="app">
    <!-- Mobile top bar -->
    <header class="mobile-bar">
      <button class="icon-btn" id="openSidebar" aria-label="Open chat history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="mobile-title">Nimbus</span>
      <button class="icon-btn" id="mobileNewChat" aria-label="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </span>
          <span class="brand-name">Nimbus</span>
        </div>
        <div class="sidebar-top-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Switch to light theme" title="Switch theme" aria-pressed="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" class="theme-icon theme-icon--sun"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" class="theme-icon theme-icon--moon"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 1010.5 10.5z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn sidebar-close" id="closeSidebar" aria-label="Close chat history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New chat
      </button>

      <div class="history-label">Recent</div>
      <nav class="history-list" id="historyList" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button class="user-chip" id="userChip">
          <span class="avatar avatar--user">JK</span>
          <span class="user-chip-text">
            <span class="user-name">Jordan Kim</span>
            <span class="user-plan">Free plan</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="chip-caret"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-header-info">
          <span class="bot-avatar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/></svg>
          </span>
          <div>
            <div class="chat-title">Nimbus Assistant</div>
            <div class="chat-status"><span class="status-dot"></span>Online</div>
          </div>
        </div>
        <button class="icon-btn" id="clearChat" aria-label="Clear conversation" title="Clear conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="message-list" id="messageList">
        <div class="empty-state" id="emptyState">
          <span class="empty-mark">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </span>
          <h1>What can I help with?</h1>
          <p>Ask anything - or try one of these to get started.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms">
              <span class="suggestion-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 21h4M11 17.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
              <strong>Explain a concept</strong>
              <span>Quantum computing in simple terms</span>
            </button>
            <button class="suggestion-card" data-prompt="Write a polite email asking for a deadline extension">
              <span class="suggestion-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3.5 6.5h17v11h-17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <strong>Draft an email</strong>
              <span>Ask for a deadline extension, politely</span>
            </button>
            <button class="suggestion-card" data-prompt="Give me a 3-day itinerary for Kyoto, Japan">
              <span class="suggestion-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 005 9.5C5 14.9 12 21 12 21z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.3" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg></span>
              <strong>Plan a trip</strong>
              <span>3-day itinerary for Kyoto</span>
            </button>
            <button class="suggestion-card" data-prompt="Debug this: my for loop never terminates in Python">
              <span class="suggestion-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 5l-5 7 5 7M15 5l5 7-5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <strong>Debug code</strong>
              <span>A loop that never terminates</span>
            </button>
          </div>
        </div>
      </div>

      <button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="Scroll to latest message" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <form class="composer" id="composerForm">
        <div class="composer-box">
          <textarea
            id="messageInput"
            class="composer-input"
            placeholder="Message Nimbus…"
            rows="1"
            maxlength="4000"
            aria-label="Message"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="composer-hint">Nimbus can make mistakes. This is a demo UI with simulated replies.</div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
