<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Aurora</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 2v20M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Aurora</span>
      </div>

      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Sign in to continue to your dashboard.</p>

      <div class="banner" id="formBanner" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 7l7.4 5.6a1 1 0 0 0 1.2 0L20 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="emailError"
              required
            />
          </div>
          <p class="error" id="emailError"></p>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="password">Password</label>
            <a href="#" class="link-muted" id="forgotLink">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="10.5" width="14" height="9.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-describedby="passwordError"
              required
              minlength="8"
            />
            <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="icon-eye-off icon-is-hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1M6.5 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="error" id="passwordError"></p>
        </div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="checkbox-box" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                <path d="M3 8.5l3.2 3.2L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-label">Sign in</span>
          <span class="spinner" aria-hidden="true" hidden></span>
        </button>
      </form>

      <p class="signup-line">
        Don't have an account? <a href="#" id="signupLink" class="link-strong">Sign up</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
